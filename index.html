<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المسابقة</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#1a7f5a;--bd:#dde1e6}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--card:#1f2328;--tx:#eceff3;--mu:#99a;--ac:#3fb98a;--bd:#33383f;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:860px;margin:auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:22px}h2{font-size:17px;margin:0 0 10px}
button,.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
textarea,input[type=text]{width:100%;box-sizing:border-box;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
#drop{border:2px dashed var(--ac);border-radius:12px;padding:28px;text-align:center;color:var(--mu)}
#drop.o{background:var(--bg)}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.mu{color:var(--mu);font-size:14px}pre{direction:ltr;text-align:left;background:var(--bg);padding:8px;border-radius:8px;overflow-x:auto;font-size:12px}
iframe{width:100%;height:80vh;border:1px solid var(--bd);border-radius:12px;background:#fff}
</style></head><body><main id="app"><p class="mu">جاري التحميل…</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const ADMIN_EMAIL="magdysamuel.oc@gmail.com";
const fb=initializeApp({
  apiKey:"AIzaSyB94W9NmSwavjwk2hqthV4FPZGjGumWAks",
  authDomain:"quiz-contest-52d78.firebaseapp.com",
  projectId:"quiz-contest-52d78",
  storageBucket:"quiz-contest-52d78.firebasestorage.app",
  messagingSenderId:"645046467400",
  appId:"1:645046467400:web:4452d8477dd0f2ad9ad17d"});
const db=getFirestore(fb),auth=getAuth(fb);
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BASE=location.origin+location.pathname;
const hash=location.hash.slice(1);

if(hash.startsWith("p-"))participant(hash.slice(2));
else onAuthStateChanged(auth,u=>{
  if(u&&u.email===ADMIN_EMAIL)organizer();
  else app.innerHTML='<div class="c"><h2>لوحة المنظّم</h2><p><button id="in">دخول بجوجل</button></p>'+(u?'<p class="mu">الحساب ده ('+esc(u.email)+') مش منظّم.</p>':'')+'</div>',
       $("#in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
});

/* ---------- المشارك ---------- */
async function participant(code){
  try{
    const ref=doc(db,"codes",code),s=await getDoc(ref);
    if(!s.exists()){app.innerHTML='<div class="c"><h2>كود غير صحيح</h2></div>';return}
    if(s.data().score!=null){app.innerHTML='<div class="c"><h2>انت خلّصت المسابقة قبل كده</h2></div>';return}
    try{await setDoc(doc(db,"claims",code),{startedAt:Date.now()})}
    catch(e){app.innerHTML='<div class="c"><h2>اللينك ده اتفتح قبل كده</h2><p class="mu">المسابقة بتتفتح مرة واحدة فقط.</p></div>';return}
    const c=await getDoc(doc(db,"contest","main"));
    if(!c.exists()){app.innerHTML='<div class="c">المسابقة لسه ما اتجهزتش.</div>';return}
    app.innerHTML='<div class="c"><b>أهلاً '+esc(s.data().name||"")+'</b> — اللينك اتفعّل، ماتقفلش الصفحة.</div><iframe id="q" sandbox="allow-scripts"></iframe><div id="done"></div>';
    $("#q").srcdoc=c.data().html;
    let sent=false;
    addEventListener("message",async e=>{
      if(sent||e.source!==$("#q").contentWindow||!e.data||e.data.type!=="score")return;
      const n=Number(e.data.score);if(!isFinite(n))return;
      sent=true;
      try{await updateDoc(ref,{score:n,finishedAt:Date.now()});$("#done").innerHTML='<div class="c"><h2>تم تسجيل نتيجتك: '+esc(n)+'</h2></div>'}
      catch(err){sent=false;$("#done").innerHTML='<div class="c">حصل خطأ في حفظ النتيجة، جرّب تاني.</div>'}
    });
  }catch(e){app.innerHTML='<div class="c">حصل خطأ، جرّب تاني.</div>'}
}

/* ---------- المنظّم ---------- */
let rows=[];
function organizer(){
  app.innerHTML=`<h1>🏆 منظّم المسابقات</h1>
  <div class="c"><h2>١) ارفع المسابقة (HTML)</h2>
   <div id="drop">اسحب ملف المسابقة .html هنا أو <label style="color:var(--ac);cursor:pointer">اختار ملف<input id="f" type="file" accept=".html,.htm" hidden></label></div>
   <p id="cs" class="mu"></p>
   <p class="mu">لازم المسابقة في آخرها تبعت النتيجة بالسطر ده:</p>
   <pre>parent.postMessage({type:"score", score: 8}, "*");</pre></div>
  <div class="c"><h2>٢) الأرقام</h2>
   <textarea id="nums" rows="5" placeholder="رقم في كل سطر، أو: الاسم,الرقم&#10;أحمد,201001234567"></textarea>
   <p class="mu">الرقم بكود الدولة (20 لمصر) من غير + أو صفر في الأول.</p>
   <textarea id="msg" rows="2">أهلاً {name}، دي مسابقتك. اللينك بيتفتح مرة واحدة بس: {link}</textarea>
   <p><button id="gen">إنشاء الأكواد</button></p></div>
  <div class="c"><h2>٣) المشاركين والترتيب</h2>
   <p><button id="csv" class="s">تصدير CSV</button> <button id="rf" class="s">تحديث</button> <button id="out" class="s">خروج</button></p>
   <div class="t"><table id="tb"></table></div></div>`;
  const setFile=async f=>{if(!f)return;const html=await f.text();
    try{await setDoc(doc(db,"contest","main"),{html,title:f.name,at:Date.now()});$("#cs").textContent="تم حفظ: "+f.name}
    catch(e){$("#cs").textContent="فشل الحفظ"}};
  $("#f").onchange=e=>setFile(e.target.files[0]);
  const dr=$("#drop");
  dr.ondragover=e=>{e.preventDefault();dr.classList.add("o")};
  dr.ondragleave=()=>dr.classList.remove("o");
  dr.ondrop=e=>{e.preventDefault();dr.classList.remove("o");setFile(e.dataTransfer.files[0])};
  getDoc(doc(db,"contest","main")).then(s=>{if(s.exists())$("#cs").textContent="المسابقة الحالية: "+(s.data().title||"")});
  $("#gen").onclick=gen;$("#rf").onclick=load;$("#csv").onclick=csv;$("#out").onclick=()=>signOut(auth);load();
}
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
async function gen(){
  for(const l of $("#nums").value.split("\n").map(x=>x.trim()).filter(Boolean)){
    const p=l.split(/[,،\t]/).map(x=>x.trim()),phone=(p.pop()||"").replace(/\D/g,""),name=p.join(" ");
    if(phone.length<8)continue;
    await setDoc(doc(db,"codes",rnd()),{phone,name,createdAt:Date.now(),score:null});
  }
  $("#nums").value="";load();
}
async function load(){
  const [cs,cl]=await Promise.all([getDocs(collection(db,"codes")),getDocs(collection(db,"claims"))]);
  const started={};cl.forEach(d=>started[d.id]=d.data().startedAt);
  rows=cs.docs.map(d=>({id:d.id,...d.data(),startedAt:started[d.id]}));
  rows.sort((a,b)=>(b.score??-1)-(a.score??-1)||((a.finishedAt-a.startedAt)||1e15)-((b.finishedAt-b.startedAt)||1e15));
  let rank=0;
  $("#tb").innerHTML="<tr><th>#</th><th>الاسم</th><th>الرقم</th><th>الحالة</th><th>الدرجة</th><th>الزمن</th><th>واتساب</th></tr>"+rows.map(c=>{
    const done=c.score!=null,st=done?"خلّص":c.startedAt?"فتح":"لسه";
    const t=done&&c.startedAt?Math.round((c.finishedAt-c.startedAt)/1000)+" ث":"-";
    const m=$("#msg").value.replace("{name}",c.name||"").replace("{link}",BASE+"#p-"+c.id);
    const wa="https://wa.me/"+c.phone+"?text="+encodeURIComponent(m);
    return "<tr><td>"+(done?++rank:"-")+"</td><td>"+esc(c.name)+"</td><td dir=ltr>"+esc(c.phone)+"</td><td>"+st+"</td><td>"+(done?esc(c.score):"-")+"</td><td>"+t+"</td><td>"+(c.startedAt?"":'<a class="b" target="_blank" rel="noopener" href="'+wa+'">إرسال</a>')+"</td></tr>";
  }).join("");
}
function csv(){
  const r=[["rank","name","phone","code","score","seconds"]];let k=0;
  rows.forEach(c=>{const d=c.score!=null;r.push([d?++k:"",c.name||"",c.phone,c.id,d?c.score:"",d&&c.startedAt?Math.round((c.finishedAt-c.startedAt)/1000):""])});
  const data="\ufeff"+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download="results.csv";a.click();
}
</script></body></html>
