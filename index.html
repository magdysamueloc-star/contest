const SUPER="magdysamuel.oc@gmail.com";
const fb=initializeApp({apiKey:"AIzaSyB94W9NmSwavjwk2hqthV4FPZGjGumWAks",authDomain:"quiz-contest-52d78.firebaseapp.com",projectId:"quiz-contest-52d78",storageBucket:"quiz-contest-52d78.firebasestorage.app",messagingSenderId:"645046467400",appId:"1:645046467400:web:4452d8477dd0f2ad9ad17d"});
const db=getFirestore(fb),auth=getAuth(fb);

let U,contests=[],codes=[],sel=null;
function probe(cfg){
  var sent=false,D="٠١٢٣٤٥٦٧٨٩",log=cfg.log.slice(),rep=false,tm;
  function path(el){var p=[];while(el&&el!==document.body&&el.parentNode){p.unshift(Array.prototype.indexOf.call(el.parentNode.children,el));el=el.parentNode}return p.join(".")}
  function find(p){var el=document.body,a=p===""?[]:p.split(".");for(var i=0;i<a.length;i++)el=el&&el.children[+a[i]];return el}
  function save(){clearTimeout(tm);tm=setTimeout(function(){parent.postMessage({type:"log",log:log},"*")},500)}
  if(cfg.rec){
    document.addEventListener("click",function(e){if(rep)return;log.push({t:"c",p:path(e.target)});save()},true);
    document.addEventListener("input",function(e){var el=e.target;if(rep||!/INPUT|TEXTAREA/.test(el.tagName)||el.type==="radio"||el.type==="checkbox")return;var p=path(el);for(var i=log.length-1;i>=0;i--)if(log[i].t==="i"&&log[i].p===p){log.splice(i,1);break}log.push({t:"i",p:p,v:el.value});save()},true);
    document.addEventListener("change",function(e){var el=e.target;if(rep||el.tagName!=="SELECT")return;log.push({t:"s",p:path(el),v:el.value});save()},true);
    if(log.length){rep=true;var i=0;setTimeout(function step(){if(i>=log.length){rep=false;return}var ev=log[i++],el=find(ev.p);try{if(el){if(ev.t==="c")el.click();else{el.value=ev.v;el.dispatchEvent(new Event(ev.t==="i"?"input":"change",{bubbles:true}))}}}catch(x){}setTimeout(step,250)},800)}
  }
  function go(force){
    if(sent)return;
    var t=((document.body&&document.body.innerText)||"").replace(/[٠-٩]/g,function(d){return D.indexOf(d)});
    if(force!==true&&!/إعادة|اعادة|ابدأ من جديد|ابدأ مرة|العب مرة|حاول مرة|restart|try again|play again|retry|النتيجة النهائية|final score|تهانينا|congrat|انتهت|انتهى/i.test(t))return;
    var k="(?:score|result|النتيجة|نتيجتك|الدرجة|درجتك|المجموع|مجموع|النقاط|نقاطك|حصلت على|you got|you scored|correct|الصحيحة|صحيحة)";
    var m=t.match(new RegExp(k+"[^\\d\\n]{0,25}(\\d+(?:\\.\\d+)?)\\s*(?:\\/|من|out of)\\s*\\d+","i"))||t.match(new RegExp(k+"[^\\d\\n]{0,25}(\\d+(?:\\.\\d+)?)","i"));
    var n=m?parseFloat(m[1]):null;
    if(n===null){try{if(typeof score==="number")n=score}catch(e){}}
    if(n===null)return;
    sent=true;parent.postMessage({type:"score",score:n},"*");
  }
  setInterval(go,700);
  addEventListener("message",function(e){if(e.data&&e.data.type==="force")go(true)});
}
const wrap=(h,log,rec)=>{const cfg=JSON.stringify({log:log||[],rec:!!rec}).replace(/</g,"\\u003c"),S="<script>("+probe.toString()+")("+cfg+")<\/script>";return /<\/body>/i.test(h)?h.replace(/<\/body>/i,()=>S+"</body>"):h+S};

/* ---------- المشارك ---------- */
async function participant(code){
  try{
    const ref=doc(db,"codes",code),s=await getDoc(ref);
    if(!s.exists()){msg("كود غير صحيح");return}
    const d=s.data();
    if(d.score!=null){msg("انت خلّصت المسابقة قبل كده");return}
    const c=await getDoc(doc(db,"pages",d.contest));
    if(!c.exists()){msg("المسابقة لسه ما اتجهزتش");return}
    const pg=c.data(),resume=pg.mode==="resume",lim=(pg.limit||0)*60000;
    let st=d.startedAt;
    if(!(resume&&st)){
      try{st=Date.now();await updateDoc(ref,{startedAt:st})}catch(e){msg("اللينك ده اتفتح قبل كده","المسابقة بتتفتح مرة واحدة فقط.");return}
    }
    const rem=lim?lim-(Date.now()-st):Infinity,late=rem<=0;
    app.innerHTML='<div class="c"><b>أهلاً '+esc(d.name||"")+'</b> — '+(resume?"إجاباتك بتتحفظ، تقدر تقفل وترجع بنفس اللينك وتكمّل.":"اللينك اتفعّل، ماتقفلش الصفحة.")+' <b id="tm" style="float:left"></b></div><iframe id="q" sandbox="allow-scripts"'+(late?' style="position:absolute;left:-9999px;width:900px;height:700px"':"")+'></iframe><div id="done"></div>';
    $("#q").srcdoc=wrap(pg.html,resume?(d.log||[]):null,resume);
    let sent=false,lt,ended=false;
    const rec=async(n,over)=>{
      if(sent)return;sent=true;
      try{await updateDoc(ref,{score:n,finishedAt:Date.now()});$("#done").innerHTML='<div class="c"><h2>تم تسجيل نتيجتك: '+esc(n)+'</h2><p class="mu">أول نتيجة هي اللي بتتحسب، والإعادة للتدريب فقط.</p></div>';if(over)$("#q").style.display="none"}
      catch(err){sent=false;$("#done").innerHTML='<div class="c">حصل خطأ في حفظ النتيجة، جرّب تاني.</div>'}
    };
    const expire=()=>{
      if(ended||sent)return;ended=true;$("#tm").textContent="";
      $("#q").style.pointerEvents="none";
      $("#done").innerHTML='<div class="c"><h2>انتهى الوقت ⏰</h2><p class="mu">بنحسب نتيجتك…</p></div>';
      $("#q").contentWindow.postMessage({type:"force"},"*");
      setTimeout(()=>{if(!sent)rec(0,true)},2500);
    };
    if(lim){
      if(late)setTimeout(expire,(resume?(d.log||[]).length*250:0)+3000);
      else{
        const tick=()=>{const r=lim-(Date.now()-st);if(r<=0){expire();return}if(sent){$("#tm").textContent="";return}
          $("#tm").textContent="⏳ "+String(Math.floor(r/60000)).padStart(2,"0")+":"+String(Math.floor(r/1000)%60).padStart(2,"0");$("#tm").style.color=r<60000?"#c0392b":"";setTimeout(tick,1000)};
        tick();
      }
    }
    addEventListener("message",e=>{
      if(e.source!==$("#q").contentWindow||!e.data)return;
      if(e.data.type==="log"&&resume&&!ended){
        clearTimeout(lt);lt=setTimeout(()=>{if(JSON.stringify(e.data.log).length<200000)updateDoc(ref,{log:e.data.log}).catch(()=>{})},1000);return;
      }
      if(e.data.type!=="score")return;
      const n=Number(e.data.score);if(isFinite(n))rec(n,ended);
    });
  }catch(e){msg("حصل خطأ، جرّب تاني")}
}

/* ---------- المنظّم ---------- */
const SUP=()=>U.email===SUPER;
function organizer(u){
  U=u;
  app.innerHTML=`<div class="who">${esc(u.email)} <button id="out" class="s">خروج</button></div>
  <div class="c"><h2>${SUP()?"كل المسابقات":"مسابقاتي"}</h2>
   <p><select id="md" style="padding:8px;border-radius:9px;border:1px solid var(--bd);font:inherit;width:100%"><option value="once">اللينك يفتح مرة واحدة ويسجّل أول نتيجة</option><option value="resume">اللينك يفتح أكتر من مرة، يكمّل من حيث وقف، ويسجّل أول نتيجة</option></select></p><p><input type="number" id="lim" min="0" placeholder="مدة المسابقة بالدقايق (سيبها فاضية لو من غير وقت)" style="width:100%;padding:8px;border-radius:9px;border:1px solid var(--bd);font:inherit"></p><div id="drop">+ مسابقة جديدة: اسحب ملف .html هنا أو <label style="color:var(--b);cursor:pointer">اختار ملف<input id="f" type="file" accept=".html,.htm" hidden></label></div>
   <p id="cs" class="mu"></p>
   <p class="mu">ارفع أي مسابقة HTML عادي، والنتيجة بتتقري تلقائياً من شاشة النهاية. جرّبها بزرار «تجربة المسابقة» قبل ما تبعت.</p>
   <div id="cl"></div></div><div id="dt"></div>`+(SUP()?`<div class="c"><h2>إدارة الخدام</h2><div class="r"><input type="text" id="em" placeholder="إيميل الخادم" style="direction:ltr;text-align:left"><button id="ad">إضافة</button></div><div id="al"></div></div>`:"");
  const setFile=async f=>{
    if(!f)return;
    if(f.size>900000){$("#cs").textContent="الملف كبير (أكتر من 900KB)";return}
    const mode=$("#md").value,limit=Math.max(0,parseInt($("#lim").value)||0),def=f.name.replace(/\.html?$/i,""),title=prompt("اسم المسابقة:",def)||def,cid=rnd();
    try{
      await setDoc(doc(db,"contests",cid),{owner:U.uid,ownerEmail:U.email,title,mode,limit,at:Date.now()});
      await setDoc(doc(db,"pages",cid),{html:await f.text(),mode,limit});
      $("#cs").textContent="تم حفظ: "+title;await load();pick(cid);
    }catch(e){$("#cs").textContent="فشل الحفظ"}
  };
  $("#f").onchange=e=>setFile(e.target.files[0]);
  const dr=$("#drop");
  dr.ondragover=e=>{e.preventDefault();dr.classList.add("o")};dr.ondragleave=()=>dr.classList.remove("o");
  dr.ondrop=e=>{e.preventDefault();dr.classList.remove("o");setFile(e.dataTransfer.files[0])};
  $("#cl").onclick=e=>{const o=e.target.dataset?.o,d=e.target.dataset?.d;if(o)pick(o);if(d)delContest(d)};
  $("#out").onclick=()=>signOut(auth);
  if(SUP()){
    $("#ad").onclick=async()=>{const m=$("#em").value.trim().toLowerCase();if(!m.includes("@"))return;await setDoc(doc(db,"allowed",m),{at:Date.now()});$("#em").value="";al()};
    $("#al").onclick=async e=>{const m=e.target.dataset?.del;if(m&&confirm("حذف "+m+"؟")){await deleteDoc(doc(db,"allowed",m));al()}};al();
  }
  load();
}
async function al(){const q=await getDocs(collection(db,"allowed"));$("#al").innerHTML=q.docs.map(d=>`<div class="r"><span style="flex:1;direction:ltr;text-align:left">${esc(d.id)}</span><button class="s" data-del="${esc(d.id)}">حذف</button></div>`).join("")||'<p class="mu">لسه مفيش خدام</p>'}
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
async function load(){
  const col=n=>SUP()?collection(db,n):query(collection(db,n),where("owner","==",U.uid));
  const [a,b]=await Promise.all([getDocs(col("contests")),getDocs(col("codes"))]);
  contests=a.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.at-x.at);
  codes=b.docs.map(d=>({id:d.id,...d.data()}));
  if(sel&&!contests.find(c=>c.id===sel))sel=null;
  renderList();
  if(sel)renderTable();else $("#dt").innerHTML="";
}
function renderList(){
  $("#cl").innerHTML=contests.map(c=>{
    const cs=codes.filter(x=>x.contest===c.id),dn=cs.filter(x=>x.score!=null).length;
    return `<div class="k${c.id===sel?" on":""}"><div style="flex:1"><b>${esc(c.title)}</b><div class="mu">${SUP()?esc(c.ownerEmail)+" · ":""}${c.mode==="resume"?"أكتر من مرة":"مرة واحدة"} · ${c.limit?"⏱ "+c.limit+" دقيقة · ":""}${cs.length} مشارك · ${dn} خلّصوا</div></div><button data-o="${c.id}">فتح</button> <button class="s" data-d="${c.id}">حذف</button></div>`}).join("")||'<p class="mu">مفيش مسابقات لسه</p>';
}
function pick(cid){
  sel=cid;renderList();
  const c=contests.find(x=>x.id===cid);if(!c)return;
  const mine=c.owner===U.uid;
  $("#dt").innerHTML=(mine?`<div class="c"><h2>أسماء وأرقام: ${esc(c.title)}</h2><div id="rowsin"></div>
   <p><button id="addr" class="s">+ إضافة صف</button></p>
   <p class="mu">الرقم بكود الدولة من غير + أو صفر في الأول. مثال: 201001234567</p>
   <p><button id="gen" class="g">حفظ الأسماء وتجهيز اللينكات</button></p></div>`:"")+`<div class="c"><h2>المشاركين والترتيب: ${esc(c.title)}</h2>
   <details><summary class="mu">تعديل نص الرسالة</summary><textarea id="msg" rows="2">أهلاً {name}، دي مسابقتك. اللينك بيتفتح مرة واحدة بس: {link}</textarea></details>
   <p><button id="all" class="g">إرسال للكل</button> <button id="csv" class="s">تصدير CSV</button> <button id="rf" class="s">تحديث</button> <button id="pvb" class="s">تجربة المسابقة</button></p><div id="pv"></div>
   <div class="t2"><table id="tb"></table></div></div>`;
  if(mine){initRows();$("#addr").onclick=()=>addRow();$("#gen").onclick=gen}
  $("#all").onclick=sendNext;$("#csv").onclick=()=>csv(cid);$("#rf").onclick=load;$("#pvb").onclick=()=>preview(cid);
  $("#tb").onclick=e=>{const id=e.target.dataset?.id;if(id)sendTo(id)};
  renderTable();
}
async function preview(cid){
  const p=await getDoc(doc(db,"pages",cid));if(!p.exists())return;
  $("#pv").innerHTML='<p id="pvs" class="mu">العب المسابقة للآخر، وهنا هتظهر النتيجة اللي اتقرت (تجربة ومش بتتسجل).</p><iframe id="pf" sandbox="allow-scripts"></iframe>';
  $("#pf").srcdoc=wrap(p.data().html,[],false);
  const h=e=>{if(e.source!==$("#pf")?.contentWindow||e.data?.type!=="score")return;$("#pvs").innerHTML="✅ النتيجة اتقرت: <b>"+esc(e.data.score)+"</b>"};
  addEventListener("message",h);
}
function addRow(){const d=document.createElement("div");d.className="r";d.innerHTML='<input type="text" placeholder="الاسم"><input type="text" placeholder="الرقم 201001234567" inputmode="numeric">';$("#rowsin").appendChild(d)}
function initRows(){$("#rowsin").innerHTML="";for(let i=0;i<5;i++)addRow()}
async function gen(){
  for(const r of document.querySelectorAll("#rowsin .r")){
    const [n,p]=r.querySelectorAll("input"),phone=p.value.replace(/\D/g,""),name=n.value.trim();
    if(phone.length<8)continue;
    await setDoc(doc(db,"codes",rnd()),{phone,name,owner:U.uid,contest:sel,createdAt:Date.now()});
  }
  initRows();load();
}
const rowsOf=cid=>codes.filter(x=>x.contest===cid).sort((a,b)=>(b.score??-1)-(a.score??-1)||((a.finishedAt-a.startedAt)||1e15)-((b.finishedAt-b.startedAt)||1e15));
function renderTable(){
  if(!$("#tb"))return pick(sel);
  const rs=rowsOf(sel),med=["🥇","🥈","🥉"];let rank=0;
  const left=rs.filter(x=>!x.sentAt&&!x.startedAt).length;
  $("#all").textContent=left?"إرسال التالي ("+left+" متبقي)":"إرسال للكل";
  $("#tb").innerHTML="<tr><th>#</th><th>الاسم</th><th>الرقم</th><th>الحالة</th><th>الدرجة</th><th>الزمن</th><th>واتساب</th></tr>"+rs.map(c=>{
    const done=c.score!=null,st=done?"خلّص":c.startedAt?"فتح":c.sentAt?"اتبعت":"لسه";
    const t=done&&c.startedAt?Math.round((c.finishedAt-c.startedAt)/1000)+" ث":"-";
    const k=done?++rank:0;
    const btn=c.startedAt?"":'<button class="'+(c.sentAt?"s":"")+'" data-id="'+c.id+'">'+(c.sentAt?"إعادة":"إرسال")+"</button>";
    return "<tr><td>"+(done?(med[k-1]||k):"-")+"</td><td>"+esc(c.name)+"</td><td dir=ltr>"+esc(c.phone)+"</td><td>"+st+"</td><td>"+(done?esc(c.score):"-")+"</td><td>"+t+"</td><td>"+btn+"</td></tr>";
  }).join("");
}
const waLink=c=>"https://wa.me/"+c.phone+"?text="+encodeURIComponent($("#msg").value.replace("{name}",c.name||"").replace("{link}",BASE+"#p-"+c.id));
async function sendTo(id){
  const c=codes.find(x=>x.id===id);if(!c)return;
  window.open(waLink(c),"_blank");
  try{await updateDoc(doc(db,"codes",id),{sentAt:Date.now()})}catch(e){}
  load();
}
function sendNext(){const c=rowsOf(sel).find(x=>!x.sentAt&&!x.startedAt);if(!c){alert("كله اتبعت");return}sendTo(c.id)}
async function delContest(cid){
  const c=contests.find(x=>x.id===cid);if(!c)return;
  if(!confirm('حذف مسابقة "'+c.title+'" وكل مشاركيها ونتايجهم؟'))return;
  if(confirm("تنزّل نسخة CSV بالنتايج قبل الحذف؟ (OK = نعم)"))csv(cid);
  let b=writeBatch(db),n=0;
  for(const d of codes.filter(x=>x.contest===cid)){b.delete(doc(db,"codes",d.id));if(++n%400===0){await b.commit();b=writeBatch(db)}}
  await b.commit();
  try{await deleteDoc(doc(db,"pages",cid))}catch(e){}
  await deleteDoc(doc(db,"contests",cid));
  if(sel===cid)sel=null;
  load();
}
function csv(cid){
  const rs=rowsOf(cid);if(!rs.length){alert("مفيش مشاركين");return}
  const r=[["rank","name","phone","score","seconds"]];let k=0;
  rs.forEach(c=>{const d=c.score!=null;r.push([d?++k:"",c.name||"",c.phone,d?c.score:"",d&&c.startedAt?Math.round((c.finishedAt-c.startedAt)/1000):""])});
  const data="\ufeff"+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=(contests.find(x=>x.id===cid)?.title||"results")+".csv";a.click();
}
</script></body></html>
